<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Галерея изображений</title>
    <link rel="stylesheet" href="style.css">
    <script src="slider.js" defer></script>
</head>
<body>
 
    <main id="content">
 
        <h1>Галерея изображений</h1>
 
        <section class="gallery" aria-label="Галерея изображений">
 
            <button type="button" class="gallery-arrow gallery-arrow--prev" id="prev-button" aria-label="Предыдущие изображения">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                    <path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
 
            <div class="gallery-viewport" id="gallery-viewport">
                <ul class="gallery-track" id="gallery-track">
                    <li class="gallery-item"><img src="images/img1.jpg" alt="Изображение 1"></li>
                    <li class="gallery-item"><img src="images/img2.jpg" alt="Изображение 2"></li>
                    <li class="gallery-item"><img src="images/img3.jpg" alt="Изображение 3"></li>
                    <li class="gallery-item"><img src="images/img4.jpg" alt="Изображение 4"></li>
                    <li class="gallery-item"><img src="images/img5.jpg" alt="Изображение 5"></li>
                    <li class="gallery-item"><img src="images/img6.jpg" alt="Изображение 6"></li>
                    <li class="gallery-item"><img src="images/img7.jpg" alt="Изображение 7"></li>
                    <li class="gallery-item"><img src="images/img8.jpg" alt="Изображение 8"></li>
                </ul>
            </div>
 
            <button type="button" class="gallery-arrow gallery-arrow--next" id="next-button" aria-label="Следующие изображения">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                    <path d="M9 4 L17 12 L9 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
 
        </section>
 
        <nav class="pager" id="pager" aria-label="Страницы галереи">
            <p class="pager-status" id="pager-status">Страница 1 из 3</p>
            <ul class="pager-dots" id="pager-dots"></ul>
        </nav>
 
    </main>
 
</body>
</html>
